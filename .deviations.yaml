# Format: reference.dunn.dev/deviations/. See README.md's brand-artifact
# note for the decision these entries record.

- standard: repository
  assertion: file-exists:avatar.svg
  reason: |
    Brand artifacts (avatar.svg, hero.svg, favicon.svg, brand.png) are
    not shipped yet: this repo ships the plugin's behavior first, its
    artwork later.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:hero.svg
  reason: |
    Same as avatar.svg above.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:favicon.svg
  reason: |
    Same as avatar.svg above.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:brand.png
  reason: |
    Derived from the SVGs above; ships in the same pass.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-contains:README.md
  reason: |
    The mandatory opening hero embed names hero.svg, which does not
    exist yet (see the file-exists deviations above). The embed line
    goes back in when the brand artifacts land.
  owner: andrew@dunn.dev

- standard: repository
  assertion: gitlab:only_allow_merge_if_pipeline_succeeds
  reason: |
    Covered by the dunn.dev group-level pipeline cascade
    (only_allow_merge_if_pipeline_succeeds: true at the group), which
    outranks this project-level flag — see repository/CONTRACT.md's
    Deviations section. The group cascade reads true; the project flag
    reads false.
  owner: andrew@dunn.dev
