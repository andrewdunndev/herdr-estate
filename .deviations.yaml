# Format: reference.dunn.dev/deviations/. See README.md's brand-artifact
# note and .gitlab-ci.yml's comment for the two decisions these entries
# record.

- standard: repository
  assertion: file-exists:avatar.svg
  reason: |
    Brand artifacts (avatar.svg, hero.svg, favicon.svg, brand.png) are
    deferred to this repo's pre-public sweep, by this build's own brief:
    node 1 ships the plugin's behavior, not its artwork.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:hero.svg
  reason: |
    Same as avatar.svg above — deferred to the pre-public sweep.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:favicon.svg
  reason: |
    Same as avatar.svg above — deferred to the pre-public sweep.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-exists:brand.png
  reason: |
    Derived from the SVGs above; ships in the same pre-public-sweep pass.
  owner: andrew@dunn.dev

- standard: repository
  assertion: file-contains:README.md
  reason: |
    The mandatory opening hero embed names hero.svg, which does not
    exist yet (see the file-exists deviations above). The embed line
    goes back in when the brand artifacts land.
  owner: andrew@dunn.dev

- standard: repository
  assertion: gitlab:only_allow_merge_if_pipeline_succeeds
  reason: |
    Covered by the dunn.dev group-level pipeline cascade (group
    13121531, only_allow_merge_if_pipeline_succeeds: true), which
    outranks this project-level flag — see repository/CONTRACT.md's
    Deviations section. Measured live 2026-09-21: the group cascade
    reads true, the project flag reads false.
  owner: andrew@dunn.dev

- standard: pipeline
  assertion: file-contains:.gitlab-ci.yml
  reason: |
    The dunn.dev/pipeline catalog ships no Python component yet. Node
    1's CI is a single plain job on a public python:3-slim image tag
    running the test suite; adopt the catalog once it grows a Python
    component, or once this repo has enough CI surface (lint, build)
    to justify reference-check alongside it.
  owner: andrew@dunn.dev
