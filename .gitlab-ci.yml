default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - lint
  - build

include:
  # cargo fmt --check + cargo clippy -D warnings via the catalog's
  # pinned ci-rust image.
  - component: gitlab.com/dunn.dev/pipeline/rust-lint@4.6.0

  # cargo build + cargo test on every push and merge request.
  - component: gitlab.com/dunn.dev/pipeline/rust-build@4.6.0
    inputs:
      package_path: .
