default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages:
  - lint
  - build
  - package
  - release

include:
  # cargo fmt --check + cargo clippy -D warnings via the catalog's
  # pinned ci-rust image.
  - component: gitlab.com/dunn.dev/pipeline/rust-lint@4

  # cargo build + cargo test on every push and merge request.
  - component: gitlab.com/dunn.dev/pipeline/rust-build@4
    inputs:
      package_path: .

  # cargo-audit vulnerability scan (overridden below to allow_failure: false).
  - component: gitlab.com/dunn.dev/pipeline/rust-audit@4

  # Tag-only: signed binaries, SBOMs, provenance, GitLab Release.
  - component: gitlab.com/dunn.dev/pipeline/rust-release-binary@4
    inputs:
      binary_name: herdr-estate
      package_name: herdr-estate

  - component: gitlab.com/dunn.dev/pipeline/rust-sbom@4
    inputs:
      package_name: herdr-estate

  - component: gitlab.com/dunn.dev/pipeline/slsa-attest@4

  - component: gitlab.com/dunn.dev/pipeline/release-create@4
    inputs:
      package_name: herdr-estate
  - component: gitlab.com/dunn.dev/pipeline/github-release@4
    inputs:
      github_repo: andrewdunndev/herdr-estate

# rust-lint and rust-audit ship with no rules of their own, so they
# fall back to the implicit only: [branches, tags] default and never
# run in MR pipelines; restate rules to include merge_request_event.
lint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

audit:
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
