[package]
name = "herdr-estate"
version = "0.1.0"
edition = "2021"
description = "Durable campaigns for herdr: resume a campaign's latest conversation or start fresh, addressed by estate/campaign."
license = "MIT"
repository = "https://gitlab.com/dunn.dev/herdr-estate"
rust-version = "1.88"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
unicode-segmentation = "1"
unicode-width = "0.2"
