<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" role="img" font-family="Helvetica, Arial, sans-serif" aria-label="estates.toml lives in herdr's plugin config dir; campaigns live under the estate root; logs, ownership, prompts, worktrees and locks live in the plugin's state dir.">
  <rect x="0" y="0" width="1200" height="516" fill="#f4f4f4"/>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#4a6741">where things live</text>
  <text x="20" y="54" font-size="12" fill="#404040">the estate table in herdr's config dir, campaigns in the estate's repo, the plugin's own files in its state dir.</text>
  <g font-family="Helvetica, Arial, sans-serif" transform="translate(0,80)">
    <rect x="20" y="20" width="1160" height="356" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <!-- config -->
    <rect x="40" y="40" width="360" height="316" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="60" y="62" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">CONFIG</text>
    <text x="60" y="86" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">~/.config/herdr/plugins/config/herdr-estate/</text>
    <rect x="60" y="102" width="320" height="78" rx="4" fill="#4a6741"/>
    <text x="80" y="126" font-size="13" font-weight="600" fill="#ffffff">estates.toml</text>
    <text x="80" y="146" font-size="11" fill="#ffffff" opacity="0.85">the estate table, for herdr and shell runs alike</text>
    <text x="80" y="166" font-size="10" fill="#ffffff" opacity="0.85" font-family="Menlo, monospace">$ herdr plugin config-dir herdr-estate</text>
    <rect x="60" y="196" width="320" height="62" rx="4" fill="#ffffff" stroke="#707070" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="80" y="220" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">~/.config/herdr-estate/estates.toml</text>
    <text x="80" y="242" font-size="11" fill="#707070">read instead when the table above is missing</text>
    <rect x="60" y="274" width="320" height="62" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="80" y="298" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">~/.config/herdr/config.toml</text>
    <text x="80" y="320" font-size="11" fill="#707070">herdr's own: the key bound to the picker</text>
    <!-- estate root -->
    <rect x="420" y="40" width="360" height="316" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="440" y="62" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">ESTATE ROOT</text>
    <text x="440" y="86" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">~/estates/home/</text>
    <rect x="440" y="102" width="320" height="234" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="460" y="126" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">prompts/base.md</text>
    <text x="460" y="144" font-size="11" fill="#707070">appended to claude's system prompt</text>
    <text x="460" y="172" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">campaigns/garden/</text>
    <text x="476" y="192" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">campaign.md</text>
    <text x="584" y="192" font-size="11" fill="#707070">what it is for</text>
    <text x="476" y="210" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">log.md</text>
    <text x="584" y="210" font-size="11" fill="#707070">dated entries</text>
    <text x="476" y="228" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">sessions.log</text>
    <text x="584" y="228" font-size="11" fill="#707070">one line per conversation</text>
    <text x="460" y="264" font-size="11" fill="#707070">the agent starts here, unless a worktree is set,</text>
    <text x="460" y="282" font-size="11" fill="#707070">with its address in the environment:</text>
    <text x="460" y="304" font-size="10" fill="#4a6741" font-family="Menlo, monospace">HERDR_ESTATE_ADDRESS=home/garden</text>
    <!-- state -->
    <rect x="800" y="40" width="360" height="316" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="62" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">STATE</text>
    <text x="820" y="86" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">~/.local/state/herdr/plugins/herdr-estate/</text>
    <rect x="820" y="102" width="320" height="234" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="840" y="126" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">events.log</text>
    <text x="840" y="144" font-size="11" fill="#707070">every run, one line per step</text>
    <text x="840" y="170" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">owned.json</text>
    <text x="840" y="188" font-size="11" fill="#707070">the workspaces herdr-estate created</text>
    <text x="840" y="214" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">home-garden.prompt.md</text>
    <text x="840" y="232" font-size="11" fill="#707070">the estate's prompts, joined</text>
    <text x="840" y="258" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">worktrees/&lt;repo&gt;/&lt;branch&gt;</text>
    <text x="840" y="276" font-size="11" fill="#707070">made when a launch needs one, never removed</text>
    <text x="840" y="302" font-size="10" fill="#0a0a0a" font-family="Menlo, monospace">locks/</text>
    <text x="840" y="320" font-size="11" fill="#707070">one per campaign, held while a launch runs</text>
  </g>
  <line x1="20" y1="472" x2="1180" y2="472" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="494" font-size="10" fill="#909090">$HERDR_PLUGIN_CONFIG_DIR and $HERDR_PLUGIN_STATE_DIR win when herdr sets them, then $XDG_CONFIG_HOME and $XDG_STATE_HOME.</text>
  <text x="1180" y="494" text-anchor="end" font-size="10" fill="#909090">src/paths.rs</text>
</svg>
