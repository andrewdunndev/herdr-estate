<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" font-family="Helvetica, Arial, sans-serif" aria-label="In the picker, Enter focuses, resumes or starts a campaign fresh; Ctrl-f starts fresh, and on an idle or done agent a second press stops it first.">
  <defs>
    <marker id="picker-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#404040"/></marker>
    <marker id="picker-arrow-moss" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4a6741"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="770" fill="#f4f4f4"/>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#4a6741">picker</text>
  <text x="20" y="54" font-size="12" fill="#404040">one popup of every campaign in the estate table; its footer lists the keys.</text>
  <g font-family="Helvetica, Arial, sans-serif" transform="translate(0,80)">
    <rect x="20" y="20" width="1160" height="610" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <!-- connectors, drawn under every node -->
    <path d="M300,330 H340 M340,70 V590" fill="none" stroke="#404040" stroke-width="1.5"/>
    <path d="M340,70 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="62" font-size="10" fill="#404040" font-family="Menlo, monospace">enter · live</text>
    <path d="M340,150 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="142" font-size="10" fill="#404040" font-family="Menlo, monospace">enter · dormant</text>
    <path d="M340,230 H800" fill="none" stroke="#4a6741" stroke-width="1.5" marker-end="url(#picker-arrow-moss)"/>
    <text x="356" y="222" font-size="10" fill="#404040" font-family="Menlo, monospace">enter · new</text>
    <text x="356" y="246" font-size="10" fill="#404040" font-family="Menlo, monospace">ctrl+f · no agent running</text>
    <path d="M340,320 H540" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="312" font-size="10" fill="#404040" font-family="Menlo, monospace">ctrl+f · idle or done</text>
    <path d="M720,320 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="760" y="312" text-anchor="middle" font-size="10" fill="#404040" font-family="Menlo, monospace">ctrl+f</text>
    <path d="M340,410 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="402" font-size="10" fill="#404040" font-family="Menlo, monospace">ctrl+f · working or blocked</text>
    <path d="M340,500 H540" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="492" font-size="10" fill="#404040" font-family="Menlo, monospace">enter · + create row</text>
    <text x="356" y="516" font-size="10" fill="#707070">a new estate/name was typed</text>
    <path d="M720,500 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="760" y="492" text-anchor="middle" font-size="10" fill="#404040" font-family="Menlo, monospace">enter</text>
    <path d="M340,590 H800" fill="none" stroke="#404040" stroke-width="1.5" marker-end="url(#picker-arrow)"/>
    <text x="356" y="582" font-size="10" fill="#404040" font-family="Menlo, monospace">esc or ctrl+c</text>
    <!-- the popup -->
    <rect x="50" y="250" width="250" height="160" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="70" y="272" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">POPUP</text>
    <text x="70" y="296" font-size="13" font-weight="600" fill="#0a0a0a">every campaign, one row each</text>
    <text x="70" y="322" font-size="11" fill="#404040">live: a workspace carries the address</text>
    <text x="70" y="342" font-size="11" fill="#404040">dormant: a conversation on record</text>
    <text x="70" y="362" font-size="11" fill="#404040">new: nothing on record yet</text>
    <text x="70" y="390" font-size="10" fill="#707070" font-family="Menlo, monospace">type to filter, ↑↓ to move</text>
    <!-- the two in-between states -->
    <rect x="540" y="288" width="180" height="64" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="556" y="308" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">ARMED</text>
    <text x="556" y="326" font-size="13" font-weight="600" fill="#0a0a0a">press ctrl+f again</text>
    <text x="556" y="343" font-size="11" fill="#707070">any other key disarms</text>
    <rect x="540" y="468" width="180" height="64" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="556" y="488" font-size="9" fill="#707070" font-family="Menlo, monospace" letter-spacing="0.08em">BRIEF</text>
    <text x="556" y="506" font-size="13" font-weight="600" fill="#0a0a0a">type a brief</text>
    <text x="556" y="523" font-size="11" fill="#707070">esc goes back</text>
    <!-- outcomes -->
    <rect x="800" y="42" width="340" height="56" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="66" font-size="13" font-weight="600" fill="#0a0a0a">focus its workspace</text>
    <text x="820" y="86" font-size="11" fill="#707070">resumes first if its agent has exited</text>
    <rect x="800" y="122" width="340" height="56" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="146" font-size="13" font-weight="600" fill="#0a0a0a">resume</text>
    <text x="820" y="166" font-size="11" fill="#707070">the latest conversation continues</text>
    <rect x="800" y="202" width="340" height="56" rx="4" fill="#4a6741"/>
    <text x="820" y="226" font-size="13" font-weight="600" fill="#ffffff">fresh</text>
    <text x="820" y="246" font-size="11" fill="#ffffff" opacity="0.85">a new conversation at the same address</text>
    <rect x="800" y="292" width="340" height="56" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="316" font-size="13" font-weight="600" fill="#0a0a0a">stop the agent, then fresh</text>
    <text x="820" y="336" font-size="11" fill="#707070">only in a workspace we made; other panes keep running</text>
    <rect x="800" y="382" width="340" height="56" rx="4" fill="#ffffff" stroke="#707070" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="820" y="406" font-size="13" font-weight="600" fill="#0a0a0a">nothing happens</text>
    <text x="820" y="426" font-size="11" fill="#707070">the agent is still busy</text>
    <rect x="800" y="472" width="340" height="56" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="496" font-size="13" font-weight="600" fill="#0a0a0a">write campaign.md and log.md, then fresh</text>
    <text x="820" y="516" font-size="11" fill="#707070">uncommitted; an empty brief creates nothing</text>
    <rect x="800" y="562" width="340" height="56" rx="4" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="820" y="586" font-size="13" font-weight="600" fill="#0a0a0a">the popup closes</text>
    <text x="820" y="606" font-size="11" fill="#707070">nothing changes</text>
  </g>
  <line x1="20" y1="726" x2="1180" y2="726" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="748" font-size="10" fill="#909090">resume and fresh keep their guards here; every row that opens ends focused on its workspace.</text>
  <text x="1180" y="748" text-anchor="end" font-size="10" fill="#909090">src/picker/core.rs</text>
</svg>
