[estate.home]
root = "~/estates/home"        # the repo that holds the campaigns; the only required key
campaigns = "campaigns"        # directory under root
agent = "claude"               # default herdr agent kind
paths = ["~/code"]             # extra directories, added before each campaign's own
prompts = ["prompts/base.md"]  # joined in order, appended to claude's system
                                # prompt (other kinds get no mapped flags)
env = { }                      # exported into every workspace

# In root, paths and prompts, ~ and $VAR expand first; a relative
# paths or prompts entry then resolves against root.

[estate.home.claude]
remote-control = true          # default for every campaign in this estate;
                                # a campaign's own claude: table can override
                                # or turn off with false

# Copy this file to ~/.config/herdr-estate/estates.toml, point `root` at
# a real repo, and add one [estate.<name>] table per estate. Under herdr,
# $HERDR_PLUGIN_CONFIG_DIR/estates.toml is read instead, but only when
# that file exists.
