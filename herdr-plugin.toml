id = "herdr-estate"
name = "Estate"
version = "0.2.1"
min_herdr_version = "0.9.1"
description = "Long-running campaigns for herdr: threads of agent work, addressed as estate/campaign, that outlive every conversation."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "resume"
title = "Resume"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "resume"]

[[actions]]
id = "fresh"
title = "Fresh"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "fresh"]

[[actions]]
id = "list"
title = "List"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "list"]

[[actions]]
id = "pick"
title = "Pick"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "pick"]

# The picker's hand-off when a row's workspace is the popup's own
# (src/detach.rs): herdr runs an action outside every workspace, so the
# close can't end it. The address rides in the invocation's context.
# No contexts: nothing for an operator to invoke them from.
[[actions]]
id = "dispatch-open"
title = "Picker hand-off: open"
contexts = []
command = ["target/release/herdr-estate", "pick", "--dispatch", "open"]

[[actions]]
id = "dispatch-fresh"
title = "Picker hand-off: fresh"
contexts = []
command = ["target/release/herdr-estate", "pick", "--dispatch", "fresh"]

[[actions]]
id = "dispatch-stop"
title = "Picker hand-off: stop and fresh"
contexts = []
command = ["target/release/herdr-estate", "pick", "--dispatch", "stop"]

[[panes]]
id = "picker"
title = "campaigns"
placement = "popup"
width = "90%"
height = "90%"
command = ["target/release/herdr-estate", "pick"]
