id = "herdr-estate"
name = "Estate"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Durable campaigns for herdr: resume a campaign's latest conversation or start fresh, addressed by estate/campaign."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "resume"
title = "Resume"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "resume"]

[[actions]]
id = "fresh"
title = "Fresh"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "fresh"]

[[actions]]
id = "list"
title = "List"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "list"]

[[actions]]
id = "pick"
title = "Pick"
contexts = ["workspace"]
command = ["target/release/herdr-estate", "pick"]

[[panes]]
id = "picker"
title = "campaigns"
placement = "popup"
width = "90%"
height = "90%"
command = ["target/release/herdr-estate", "pick"]
