<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="herdr-estate hero: Durable campaigns for herdr.">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">HERDR-ESTATE · CAMPAIGN CONTINUITY · HERDR PLUGIN</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">herdr-estate</text>
  <text x="60" y="172" font-size="14" fill="#404040">Gives herdr durable campaigns: threads of agent work addressed</text>
  <text x="60" y="192" font-size="14" fill="#404040">as estate/campaign, that resume where they left off, not cold.</text>
  <text x="60" y="222" font-size="12" font-style="italic" fill="#404040">Durable campaigns for herdr</text>
  <g transform="translate(110 240) scale(2.2)">
  <g stroke="#4a6741" fill="none" stroke-linecap="round">
    <rect x="10" y="10" width="44" height="44" stroke-width="1.8" rx="1"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke-width="1.2"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke-width="1.2"/>
  </g>
  <rect x="14" y="14" width="14" height="14" fill="#4a6741"/>
  <rect x="36" y="36" width="14" height="14" fill="#4a6741"/>
  </g>
  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>
  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">resume/fresh</text>
  <text x="578" y="178" font-size="11" fill="#404040">the only two verbs that open a workspace</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">ESTATE/CAMPAIGN · DRY-RUN</text>
  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">four guards</text>
  <text x="868" y="178" font-size="11" fill="#404040">refuses a workspace it didn't create</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">DUPLICATE · LIVE · UNCONFIRMED</text>
  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">a workspace</text>
  <text x="578" y="318" font-size="11" fill="#404040">a workspace, cwd from an optional worktree</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">WORKSPACE · WORKTREE OPTIONAL</text>
  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">its own log</text>
  <text x="868" y="318" font-size="11" fill="#404040">its own continuity log, not herdr's resume</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">SESSIONS.LOG · MANUAL REMOVAL</text>
  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">HERDR · TUI · RUST · WORKSPACES</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">GITLAB.COM/DUNN.DEV/HERDR-ESTATE</text>
  </g>
